name: Update WakaTime Cards

on:
  schedule:
    # 00:15 UTC (07:15 WIB). Sengaja digeser 15 menit dari workflow lain yang
    # jalan 00:00, supaya tidak rebutan push ke main di waktu yang sama.
    - cron: "15 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_waka_cards.py"
      - ".github/workflows/waka-cards.yml"

permissions:
  contents: write

concurrency:
  group: waka-cards
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate WakaTime cards
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKA_RANGE: all_time
          WAKA_LANG_TOP_N: "6"
          WAKA_SIDE_TOP_N: "3"
          WAKA_OUT_DIR: profile
        run: python scripts/generate_waka_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/wakatime-dark.svg profile/wakatime-light.svg

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "chore: update wakatime cards"

          # main bisa berubah di remote antara checkout dan push (misalnya
          # workflow lain baru saja push). Rebase lalu coba lagi, maksimal 5 kali.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push berhasil."
              exit 0
            fi
            echo "Push gagal (percobaan $i), fetch + rebase lalu coba lagi..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done

          echo "::error::Push tetap gagal setelah beberapa kali percobaan."
          exit 1
