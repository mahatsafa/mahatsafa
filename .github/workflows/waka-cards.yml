name: Update WakaTime Cards

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC — adjust as you like
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate WakaTime cards
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKA_RANGE: all_time
          WAKA_ALL_TOP_N: "6"
          WAKA_OUT_DIR: profile
        run: python scripts/generate_waka_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/wakatime-top-3.svg profile/wakatime-all.svg
          git diff --cached --quiet || git commit -m "chore: update wakatime cards"
          git push
