name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wakatime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate WakaTime top 3 card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=mahatsafa&langs_count=3
          path: profile/wakatime1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime all languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=mahatsafa&layout=compact&custom_title=Languages%20that%20I've%20ever%20touched
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit WakaTime cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update WakaTime stats"
          git push
