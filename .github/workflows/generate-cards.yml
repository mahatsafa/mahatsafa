name: Generate README cards

on:
  schedule:
    # tiap hari jam 00:00 UTC (07:00 WIB)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_cards.py"
      - ".github/workflows/generate-cards.yml"

permissions:
  contents: write

concurrency:
  group: generate-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate cards
        run: python scripts/generate_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "chore: refresh README cards"

          # main bisa saja berubah di remote antara checkout dan push (misalnya
          # kamu lagi commit manual barengan, atau run lain lagi jalan).
          # Rebase lalu coba push lagi, sampai 5 kali, sebelum benar-benar menyerah.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push berhasil."
              exit 0
            fi
            echo "Push gagal (percobaan $i), fetch + rebase lalu coba lagi..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done

          echo "::error::Push tetap gagal setelah beberapa kali percobaan."
          exit 1
